<!doctype html>
<html lang="en" data-root="../../../">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shaken, Stirred &amp; Sautéed</title>
  <meta name="description" content="A personal collection of baking, cooking, and cocktail recipes.">
  <meta name="theme-color" content="#e5e8ea" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15120f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="../logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../../../assets/icon-192.png">
  <link rel="stylesheet" href="../theme.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">
      <svg class="brand-mark" viewBox="0 0 40 48" width="27" height="32" aria-hidden="true" focusable="false"><rect class="lg-sheet" x="2.5" y="2.5" width="35" height="43" rx="3" fill="#FAFBFC" stroke="#231C18" stroke-width="2.2"/><path class="lg-stem" d="M18.4 41C19.8 32 20.8 22 21 13.6" fill="none" stroke="#231C18" stroke-width="2" stroke-linecap="round"/><path class="lg-b" d="M19.6 31C19.55 26.47 14.99 24.29 10.51 25.75C11.48 30.36 15.65 33.22 19.6 31ZM19.6 31C23.63 33.08 27.69 30.08 28.5 25.44C23.97 24.13 19.49 26.47 19.6 31Z" fill="#955a00"/><path class="lg-c" d="M20.4 22.5C21.07 18.76 17.7 16.36 13.81 16.97C13.88 20.91 16.83 23.81 20.4 22.5ZM20.4 22.5C24.01 23.69 26.86 20.68 26.79 16.75C22.89 16.26 19.6 18.78 20.4 22.5Z" fill="#7a1d18"/><path class="lg-k" d="M20.9 13.4C23.11 12.01 22.69 9.35 20.51 7.81C18.56 9.63 18.52 12.33 20.9 13.4Z" fill="#006162"/><rect class="lg-tape" x="11.5" y="33.6" width="15" height="5.2" transform="rotate(-9 19 36.2)" fill="#DDD0B0"/></svg>
      <span class="brand-name">Shaken, Stirred <span class="amp">&amp;</span> Sautéed</span>
      <span class="brand-sub">A kitchen field guide</span>
    </a>
  </header>

  <main class="container">
    <div class="controls">
      <label class="search">
        <span class="visually-hidden">Search recipes</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search by name, ingredient, or tag…" autocomplete="off">
      </label>

      <nav class="tabs" id="tabs" aria-label="Sections"></nav>

      <div class="filter-host">
        <div class="filter-row" id="filters" aria-label="Filters"></div>
        <div class="active-row" id="active" aria-label="Active filters"></div>

        <div class="backdrop" id="backdrop" hidden></div>
        <div class="sheet" id="sheet" role="dialog" aria-labelledby="sheet-title" hidden>
          <div class="sheet-head">
            <h2 id="sheet-title"></h2>
            <button class="btn" id="sheet-done">Done</button>
          </div>
          <div class="sheet-body" id="sheet-body"></div>
        </div>
      </div>

      <div class="result-bar">
        <span id="count" aria-live="polite"></span>
        <label class="sort">Sort
          <select id="sort">
            <option value="az">A–Z</option>
            <option value="new">Newest</option>
            <option value="quick">Quickest</option>
          </select>
        </label>
      </div>
    </div>

    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <script src="../../../assets/common.js"></script>
  <script src="../../../assets/recipe-view.js"></script>
  <script type="module" src="../../../assets/home.mjs"></script>
</body>
</html>
