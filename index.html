<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Shaken, Stirred &amp; Sautéed</title>
  <meta name="description" content="A personal collection of baking, cooking, and cocktail recipes.">
  <meta name="theme-color" content="#b4532a">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">🍸</span>
      <span class="brand-name">Shaken, Stirred <span class="amp">&amp;</span> Sautéed</span>
    </a>
  </header>

  <main class="container">
    <div class="controls">
      <label class="search">
        <span class="visually-hidden">Search recipes</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        <input id="search" type="search" placeholder="Search by name, ingredient, or tag…" autocomplete="off">
      </label>

      <nav class="tabs" id="tabs" aria-label="Categories"></nav>

      <div class="tag-row" id="tags" aria-label="Filter by tag"></div>

      <div class="result-bar">
        <span id="count" aria-live="polite"></span>
        <label class="sort">Sort
          <select id="sort">
            <option value="az">A–Z</option>
            <option value="new">Newest</option>
            <option value="quick">Quickest</option>
          </select>
        </label>
      </div>
    </div>

    <ul class="grid" id="grid"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <script src="assets/common.js"></script>
  <script src="assets/home.js"></script>
</body>
</html>
