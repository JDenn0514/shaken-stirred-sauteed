# Puts the "This site has moved" page (moved/) on GitHub Pages, so the old
# address, jdenn0514.github.io/shaken-stirred-sauteed/, sends every visitor to
# the same page on shaken-stirred-sauteed.com. The site itself is on Cloudflare
# (wrangler.jsonc).
#
# Run it by hand (Actions > Old address: moved page > Run workflow), once the
# new domain works and the repo's Settings > Pages > Source is "GitHub Actions".
name: "Old address: moved page"

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v3
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@v4
