# Puts the "This site has moved" page (moved/) on GitHub Pages, so the old
# address, jdenn0514.github.io/shaken-stirred-sauteed/, sends every visitor to
# the same page on shaken-stirred-sauteed.com. The site itself is on Cloudflare
# (wrangler.jsonc).
#
# Run it by hand (Actions > Old address: moved page > Run workflow), once the
# new domain works and the repo's Settings > Pages > Source is "GitHub Actions".
name: "Old address: moved page"

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: moved
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
