name: Check recipes

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate recipes and confirm index.json is up to date
        run: |
          node scripts/build-index.mjs
          git diff --exit-code recipes/index.json || {
            echo "::error::recipes/index.json is out of date. Run 'node scripts/build-index.mjs' and commit the result."
            exit 1
          }
      - name: Install test tools
        run: npm ci
      - name: Recipe checker tests
        run: npm run test:unit
      # Uses the Google Chrome already installed on GitHub's runners.
      - name: Browser tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
