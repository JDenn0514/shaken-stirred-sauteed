name: Check recipes

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate recipes and confirm index.json is up to date
        run: |
          node scripts/build-index.mjs
          git diff --exit-code recipes/index.json || {
            echo "::error::recipes/index.json is out of date. Run 'node scripts/build-index.mjs' and commit the result."
            exit 1
          }
